packages:
  - "apps/*"
  - "packages/*"

# Approve postinstall scripts (prisma engines, esbuild binaries).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  core-js: true
  leveldown: false
  # Neither package needs an install script (@google/genai ships prebuilt, protobufjs has none).
  "@google/genai": false
  protobufjs: false
