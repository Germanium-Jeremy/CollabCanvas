# CollabCanvas on Render.
#
# Three services from one pnpm/turbo monorepo. The database is NOT declared
# here — it lives in Neon (see neon.ts and .env.example), so DATABASE_URL is a
# sync:false secret you set once per service.
#
# Region is oregon (cheapest default). The Neon project is in aws-us-east-2;
# these are different providers, so the DB connects over the public internet.
#
# Live URLs (Render assigns a suffix when the bare name is taken):
#   web      https://collabcanvas-web-96su.onrender.com
#   api      https://collabcanvas-api-i8x4.onrender.com
#   realtime https://collabcanvas-realtime.onrender.com
#
# Cross-service URLs are sync:false rather than hardcoded: the API needs
# WEB_ORIGIN/API_PUBLIC_URL pointed at the web origin, and the web service
# needs API_PROXY_TARGET pointed at the API. Those are set once in the
# dashboard (or via scripts/set-render-env.mjs), not by this file.

databases: []

services:
  # ---- API (NestJS): auth, rooms, AI proxy, snapshots ----------------------
  - type: web
    name: collabcanvas-api
    runtime: node
    plan: free
    region: oregon
    branch: root
    repo: https://github.com/Germanium-Jeremy/CollabCanvas
    rootDir: .
    # Render's free tier rejects preDeployCommand, so the schema is applied as
    # the last build step. Safe here because db push only ever adds tables,
    # indexes and enum values — it never drops data.
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @collabcanvas/api... build &&
      pnpm --filter @collabcanvas/api exec prisma db push
    startCommand: pnpm --filter @collabcanvas/api run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; the API reads it via its config module.
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      # Must be the WEB origin, not the API origin. OAuth builds its
      # redirect_uri from this, and the callback has to travel back through
      # the Next.js proxy — otherwise the httpOnly state cookie (scoped to the
      # web domain) is not sent and the flow fails with oauth_state_mismatch.
      - key: API_PUBLIC_URL
        sync: false
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: huggingface
      - key: AI_TIMEOUT_MS
        value: "60000"
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL
        value: Qwen/Qwen3-8B
      - key: LOG_LEVEL
        value: info
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # ---- Realtime (y-websocket): CRDT sync + presence ------------------------
  - type: web
    name: collabcanvas-realtime
    runtime: node
    plan: free
    region: oregon
    branch: root
    repo: https://github.com/Germanium-Jeremy/CollabCanvas
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @collabcanvas/realtime... build
    startCommand: pnpm --filter @collabcanvas/realtime run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Must match the API's JWT_SECRET or token verification fails.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Free instances sleep after inactivity, which drops live sockets.
      # 0 disables the spin-down so collaborative editing stays connected.
      - key: RENDER_WEB_SERVICE_FREE_PLAN_SLEEP
        value: "0"

  # ---- Web (Next.js 15): UI + same-origin /api proxy -----------------------
  - type: web
    name: collabcanvas-web
    runtime: node
    plan: free
    region: oregon
    branch: root
    repo: https://github.com/Germanium-Jeremy/CollabCanvas
    # Root dir stays at the repo root: pnpm-workspace.yaml and the lockfile live
    # there, so `pnpm install` in apps/web alone would not link @collabcanvas/*
    # and `next build` fails to resolve them.
    rootDir: .
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @collabcanvas/web... build
    startCommand: pnpm --filter @collabcanvas/web run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Client calls are same-origin (empty), so Next.js proxies /api/* here.
      # This is the API's public URL — it must be set at BUILD time because
      # Next.js inlines rewrites into the server bundle.
      - key: API_PROXY_TARGET
        sync: false
      # Realtime WebSocket URL. Must be wss:// (Render serves WebSocket over
      # HTTPS at the host's URL). Set once here or via scripts/set-render-env.mjs;
      # it is build-time-only for the web service, so it travels in the
      # Blueprint rather than the runtime env.
      - key: NEXT_PUBLIC_WS_URL
        value: "wss://collabcanvas-realtime.onrender.com"
      - key: NEXT_PUBLIC_APP_URL
        sync: false
